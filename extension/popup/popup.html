<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="brandwrap"><img class="brand" src="../icons/icon48.png" alt="" width="22" height="22" /><h1>Docket</h1></span>
      <span class="headright">
        <span id="pill" class="pill hidden">Notion</span>
        <span class="menuwrap">
          <button id="btnMenu" class="iconbtn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
          </button>
          <span id="menu" class="menu hidden" role="menu">
            <button id="menuDashboard" class="menuitem" role="menuitem">Open dashboard</button>
            <button id="menuLogout" class="menuitem danger" role="menuitem">Log out</button>
          </span>
        </span>
      </span>
    </div>

    <div id="signinCard" class="card accent hidden">
      <b>Not signed in</b>
      <div class="muted">Sign in once on the dashboard — this popup picks up the login by itself.</div>
      <div class="row">
        <button id="btnSignIn" class="primary wide">Already signed in on the dashboard?</button>
      </div>
    </div>

    <div id="status" class="status">Loading…</div>

    <!-- <div id="pending" class="card signedin-only hidden">
      <b>Possible application detected</b>
      <div id="pendingJob" class="muted"></div>
      <div class="row">
        <button id="btnSavePending" class="primary">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7-8"/></svg>
          Save
        </button>
        <button id="btnIgnorePending">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
          Ignore
        </button>
      </div>
    </div> -->

    <div class="card signedin-only">
      <div class="counts"><b>Today: <span id="today">0</span> · Total: <span id="total">0</span></b></div>
    </div>

    <div id="jobCard" class="card signedin-only hidden">
      <b>Current page job</b>
      <div id="current" class="muted"></div>
      <div class="row">
        <button id="btnSaveCurrent" class="primary">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7-8"/></svg>
          Save manually
        </button>
      </div>
    </div>

    <details class="card signedin-only">
      <summary>Can&apos;t detect it? Enter manually</summary>
      <div class="fields">
        <input id="fCompany" placeholder="Company" />
        <input id="fTitle" placeholder="Job title" />
        <input id="fUrl" placeholder="Job URL" />
        <input id="fLocation" placeholder="Location" />
      </div>
      <button id="btnManual" class="primary">Save application</button>
    </details>

    <details class="card signedin-only" id="settingsCard">
      <summary>Settings</summary>
      <div id="sessionArea"></div>
      <div class="row">
        <button id="btnTest">Test connection</button>
        <button id="btnOpenNotion">Open Notion</button>
      </div>
    </details>

    <div id="msg" class="muted"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
